<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kvíz - SOČ</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap)');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-700">
        
        <!-- HLAVNÉ MENU -->
        <div id="view-role-select" class="text-center space-y-6">
            <h1 class="text-3xl font-bold text-indigo-400">AI Kvíz pre školy</h1>
            <p class="text-slate-400 max-w-lg mx-auto">Interaktívna hra s reálnou analýzou textu cez umelú inteligenciu.</p>
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
                <button onclick="selectRole('teacher')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 px-8 rounded-xl transition shadow-lg">👨‍🏫 Som učiteľ</button>
                <button onclick="selectRole('student')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 px-8 rounded-xl transition shadow-lg">🎓 Som žiak</button>
            </div>
        </div>

        <!-- UČITEĽ: VSTUP -->
        <div id="view-teacher-setup" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-indigo-400">Zadajte študijný text</h2>
                <button onclick="resetApp()" class="text-slate-400 hover:text-white text-sm">← Späť</button>
            </div>
            <div class="space-y-4">
                <textarea id="source-text" rows="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Sem vložte text (napr. o Francúzskej revolúcii)..."></textarea>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Počet otázok:</label>
                    <input type="number" id="num-questions" value="4" min="1" max="10" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="generateWithAI()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">✨ Generovať otázky cez AI</button>
            </div>
        </div>

        <!-- EDITOR -->
        <div id="view-teacher-editor" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-indigo-400">Skontrolujte vygenerované otázky</h2>
            <div id="questions-container" class="space-y-4 max-h-96 overflow-y-auto pr-2"></div>
            <button onclick="createRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">🚀 Vytvoriť miestnosť pre žiakov</button>
        </div>

        <!-- LOBBY -->
        <div id="view-host-lobby" class="hidden space-y-6 text-center">
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-700 inline-block mx-auto">
                <p class="text-slate-400 text-sm mb-1">PIN KÓD HRY</p>
                <h2 id="display-pin" class="text-5xl font-extrabold text-indigo-400 tracking-wider">----</h2>
            </div>
            <div>
                <h3 class="text-xl font-semibold mb-3">Pripojení študenti (<span id="player-count">0</span>):</h3>
                <div id="host-players-list" class="flex flex-wrap justify-center gap-2 min-h-[60px] p-4 bg-slate-900 rounded-xl border border-slate-700"></div>
            </div>
            <button onclick="hostNextQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">Ďalšia otázka / Spustiť</button>
        </div>

        <!-- ŽIAK: PRIPOJENIE -->
        <div id="view-student-join" class="hidden space-y-6 max-w-md mx-auto">
            <h2 class="text-2xl font-bold text-emerald-400 text-center">Pripojenie do hry</h2>
            <div class="space-y-4">
                <input type="text" id="input-pin" maxlength="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-2xl tracking-widest text-slate-100" placeholder="PIN kód">
                <input type="text" id="input-nickname" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100" placeholder="Vaša prezývka">
                <button onclick="joinRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">Vstúpiť</button>
                <button onclick="resetApp()" class="w-full text-slate-400 hover:text-white text-sm">← Späť</button>
            </div>
        </div>

        <!-- ŽIAK: HRANIE -->
        <div id="view-student-play" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-700">
                <span id="student-name-display" class="font-semibold text-emerald-400"></span>
                <span class="text-slate-400">Skóre: <strong id="student-score" class="text-white">0</strong></span>
            </div>
            <div class="space-y-6 text-center">
                <h3 id="question-text" class="text-xl font-bold text-slate-200">Čaká sa na učiteľa...</h3>
                <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </div>

    </div>

    <script>
        const socket = io();
        let state = { role: null, pin: null, questions: [], score: 0 };

        function switchView(id) {
            ['view-role-select', 'view-teacher-setup', 'view-teacher-editor', 'view-host-lobby', 'view-student-join', 'view-student-play'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function selectRole(r) { state.role = r; switchView(r === 'teacher' ? 'view-teacher-setup' : 'view-student-join'); }
        function resetApp() { switchView('view-role-select'); }

        async function generateWithAI() {
            const text = document.getElementById('source-text').value.trim();
            const count = parseInt(document.getElementById('num-questions').value) || 4;
            if (!text) return alert('Vlož text.');

            const btn = event.target;
            btn.innerText = 'AI generuje otázky...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/generate-quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, count })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                state.questions = data.questions;
                let container = document.getElementById('questions-container');
                container.innerHTML = state.questions.map((q, i) => `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                        <p class="font-semibold text-indigo-300">${i+1}. ${q.question}</p>
                        <div class="text-sm text-slate-400 grid grid-cols-2 gap-1 mt-2">
                            ${q.options.map((o, idx) => `<span class="${idx === q.correct ? 'text-emerald-400 font-bold' : ''}">${['A','B','C','D'][idx]}: ${o}</span>`).join('')}
                        </div>
                    </div>
                `).join('');
                switchView('view-teacher-editor');
            } catch (err) {
                alert('Chyba: ' + err.message);
            } finally {
                btn.innerText = '✨ Generovať otázky cez AI';
                btn.disabled = false;
            }
        }

        function createRoom() { socket.emit('create_room', { questions: state.questions }); }
        socket.on('room_created', ({ pin }) => { state.pin = pin; document.getElementById('display-pin').innerText = pin; switchView('view-host-lobby'); });

        socket.on('update_players', (players) => {
            document.getElementById('player-count').innerText = players.length;
            document.getElementById('host-players-list').innerHTML = players.map(p => `<span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm">${p.nickname}</span>`).join('');
        });

        function hostNextQuestion() { socket.emit('next_question', state.pin); }

        function joinRoom() {
            const pin = document.getElementById('input-pin').value.trim();
            const nickname = document.getElementById('input-nickname').value.trim();
            if (!pin || !nickname) return alert('Zadaj PIN aj meno.');
            state.pin = pin;
            socket.emit('join_room', { pin, nickname });
        }

        socket.on('error_msg', (msg) => alert(msg));
        socket.on('joined_ok', ({ nickname }) => { switchView('view-student-play'); document.getElementById('student-name-display').innerText = nickname; });

        socket.on('new_question', (data) => {
            document.getElementById('question-text').innerText = data.question;
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            const colors = ['bg-rose-600', 'bg-blue-600', 'bg-amber-600', 'bg-emerald-600'];
            data.options.forEach((opt, idx) => {
                grid.innerHTML += `<button onclick="submitAns(${idx})" class="${colors[idx]} text-white font-semibold p-6 rounded-xl text-lg">${['A','B','C','D'][idx]}: ${opt}</button>`;
            });
        });

        function submitAns(idx) {
            socket.emit('submit_answer', { pin: state.pin, answerIndex: idx });
            document.getElementById('question-text').innerText = 'Odoslané. Čaká sa...';
            document.getElementById('options-grid').innerHTML = '';
        }

        socket.on('answer_result', ({ isCorrect }) => {
            if (isCorrect) { state.score += 100; document.getElementById('student-score').innerText = state.score; alert('Správne! +100b'); }
            else { alert('Nesprávne.'); }
        });

        socket.on('game_over', () => { document.getElementById('question-text').innerText = 'Kvíz sa skončil!'; });
    </script>
</body>
</html>
