<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tvoja cesta — Kern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="app-topbar">
  <div class="wrap">
    <a href="dashboard.html" class="logo">
      <span class="logo-mark">K</span>
      <span style="font-size:19px;">Kern</span>
    </a>
    <div class="stat-group">
      <div class="stat-pill streak"><span class="stat-icon">🔥</span><span class="num" id="stat-streak">1</span></div>
      <div class="stat-pill xp"><span class="stat-icon">⚡</span><span class="num" id="stat-xp">0</span></div>
      <div class="stat-pill hearts"><span class="stat-icon">❤️</span><span class="num" id="stat-hearts">5</span></div>
    </div>
    <div class="user-chip">
      <div class="user-avatar" id="user-avatar">K</div>
      <span id="user-chip-name">Používateľ</span>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="wrap">
    <div class="dash-head">
      <div>
        <h1>Tvoja vizuálna cesta</h1>
        <p id="dash-progress-text">0 / 45 levelov dokončených</p>
      </div>
      <div class="progress-summary">
        <div class="progress-ring-wrap">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle class="progress-ring-bg" cx="32" cy="32" r="26"></circle>
            <circle class="progress-ring-fg" id="progress-ring-fg" cx="32" cy="32" r="26"></circle>
          </svg>
          <div class="progress-ring-label" id="progress-ring-label">0%</div>
        </div>
      </div>
    </div>

    <div class="path-shell">
      <div id="path-container"></div>
    </div>

    <div style="text-align:center;margin-top:50px;">
      <button class="btn btn-ghost btn-sm" onclick="logout()">Odhlásiť sa</button>
    </div>
  </div>
</main>

<script src="../js/script.js"></script>
<script>initDashboard();</script>
</body>
</html>
